<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>BPCL · SitePulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#f2f5fa; --card:#ffffff; --border:#e2e8f0;
    --ink:#0f172a; --muted:#64748b; --soft:#94a3b8;
    --red:#dc2626;    --red-soft:#fde8e8;
    --orange:#ea580c; --orange-soft:#ffedd5;
    --amber:#d97706;  --amber-soft:#fef3c7;
    --yellow:#ca8a04; --yellow-soft:#fef9c3;
    --blue:#2f6fc4;   --blue-soft:#e8effa;
    --green:#16a34a;  --green-soft:#dcfce7;
    --grey:#64748b;   --grey-soft:#f1f5f9;
    --track:#e2e8f0;
    /* BPCL brand */
    --gold:#FEC32C; --gold-tint:#FFF2D4; --navy:#023B64; --navy-tint:#E2ECF3; --navy-deep:#01243D;
    --stat:var(--blue); --stat-soft:var(--blue-soft);   /* set at runtime from status */
    /* ---- responsive scale system ----
       --W is the true column width on any device (phone width, capped at the app column).
       Every size below derives from it, with a floor and a ceiling, so the layout holds
       at 1x / 1.25x / 1.5x display scaling and on any screen from 320px up. */
    --W: min(100vw, 430px);
    --cardline: var(--gold);            /* widget border - gold on Overall, blue on EPC */
    /* Every size is the approved 430px value divided by 430, so the whole design
       scales as one piece. Proportions are identical on a 320px phone, a 393px
       iPhone or a 430px Pro Max - nothing grows or shrinks relative to anything
       else, which is what kept the orb clashing with card text before. */
    --gapmid: max(7px,   calc(var(--W) * 0.02093));   /*   9px @430 */
    --orb:    clamp(104px, calc(var(--W) * 0.34884), 150px);  /* 150px @430 */
    --cardh:  clamp(152px, calc(var(--W) * 0.40000), 172px);  /* 172px @430 */
    --cardp:  clamp(10px,  calc(var(--W) * 0.03023), 13px);   /*  13px @430 */
    --chipd:  clamp(43px,  calc(var(--W) * 0.12093), 52px);   /*  52px @430 */
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--canvas);color:var(--ink);
    font-family:"Poppins",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
    padding:0 calc(var(--cardp) + env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) calc(var(--cardp) + env(safe-area-inset-left));
  }
  .wrap{max-width:430px;margin:0 auto}

  /* ---------------- header ---------------- */
  header{
    position:sticky;top:0;z-index:20;background:var(--card);
    margin:0 calc(-1 * var(--cardp) - env(safe-area-inset-right)) 13px calc(-1 * var(--cardp) - env(safe-area-inset-left));
    padding:calc(20px + env(safe-area-inset-top)) calc(var(--cardp) + env(safe-area-inset-right)) 11px calc(var(--cardp) + env(safe-area-inset-left));
    border-bottom:1px solid var(--border);
  }
  .logo-row{margin:0 0 9px}
  .logo{display:block;width:100%;height:auto}
  .meta-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .fresh-chip{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--muted);
    background:var(--grey-soft);border:1px solid var(--border);border-radius:99px;padding:4px 10px;
  }
  .fresh-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blip 2.4s ease-in-out infinite}
  @keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
  .today{font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap}

  /* ---------------- project bar ---------------- */
  .proj-bar{
    display:flex;align-items:center;gap:12px;
    background:var(--navy);border:2px solid #fff;border-radius:15px;padding:13px 15px;margin-bottom:10px;
    box-shadow:0 6px 18px rgba(2,59,100,.32);
  }
  .proj-txt{flex:1;min-width:0}
  .proj-name{font-size:16px;font-weight:700;letter-spacing:-.02em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .proj-count{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-top:3px}
  /* which view am I on */
  .view-pill{
    display:inline-block;margin-top:5px;font-size:9px;font-weight:700;letter-spacing:.11em;
    text-transform:uppercase;border-radius:99px;padding:3px 9px;
    background:var(--gold);color:var(--navy-deep);
  }
  .view-pill.epc{background:#fff;color:var(--navy-deep)}
  .back-btn{
    appearance:none;border:none;cursor:pointer;flex:0 0 auto;
    width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);
    color:#fff;display:none;align-items:center;justify-content:center;
  }
  .back-btn:active{background:rgba(255,255,255,.28)}
  .back-btn svg{width:20px;height:20px}
  body.epc .back-btn{display:flex}
  body.epc .dots{display:none}
  .dots{display:flex;align-items:center;gap:5px;flex:0 0 auto}
  .dots i{width:15px;height:4px;border-radius:99px;background:var(--gold)}
  .dots i.ghost{width:6px;background:rgba(255,255,255,.4)}

  /* ---------------- hub stage ---------------- */
  .stage{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:var(--gapmid)}
  .qcard{
    position:relative;z-index:2;
    background:var(--card);border:2px solid var(--cardline);border-radius:calc(var(--W) * .03953);
    padding:var(--cardp);min-height:var(--cardh);
    display:flex;flex-direction:column;gap:var(--gapmid);
    opacity:0;transform:translateY(10px) scale(.97);
    animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes rise{to{opacity:1;transform:none}}
  .q1{align-items:flex-start;text-align:left; animation-delay:.28s}
  .q2{align-items:flex-end;  text-align:right;animation-delay:.36s}
  .q3{align-items:flex-start;text-align:left; animation-delay:.44s}
  .q4{align-items:flex-end;  text-align:right;animation-delay:.52s}
  .txt{display:flex;flex-direction:column;gap:3px;width:100%}

  .chip{width:var(--chipd);height:var(--chipd);border-radius:calc(var(--chipd) * .269);background:var(--navy-tint);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .chip svg{width:60%;height:60%}
  .chip.gold{background:var(--gold-tint)}
  .chip.ok{background:var(--green-soft)}
  .chip.bad{background:var(--red-soft)}

  .cap{font-size:clamp(8px, calc(var(--W) * .02326), 10px);font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#5b6b80}
  .val{font-size:clamp(18px, calc(var(--W) * .05349), 23px);font-weight:700;letter-spacing:-.025em;color:var(--navy);line-height:1.12}
  .val.ok{color:var(--green)}
  .val.bad{color:var(--red)}
  .sub{font-size:clamp(9px, calc(var(--W) * .02558), 11px);font-weight:400;color:var(--muted);line-height:1.35}
  .pill{
    display:inline-block;font-size:clamp(8.5px, calc(var(--W) * .02326), 10px);font-weight:600;border-radius:99px;padding:3px 9px;margin-top:3px;
  }
  .pill.behind{color:var(--red);background:var(--red-soft)}
  .pill.ahead{color:var(--green);background:var(--green-soft)}

  /* ---------------- centre orb ---------------- */
  .orb{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;
    width:var(--orb);height:var(--orb);border-radius:50%;
    /* fixed BPCL brand blue - deliberately NOT status-driven */
    background:var(--navy);border:clamp(4px, calc(var(--W) * .01163), 5px) solid var(--gold);
    box-shadow:0 10px 30px rgba(15,23,42,.32), 0 3px 10px rgba(15,23,42,.16);
    padding-bottom:calc(var(--orb) * .07);   /* lifts the heart/label block off centre */
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    opacity:0;animation:orbIn .55s cubic-bezier(.2,.8,.3,1.2) forwards .12s;
  }
  @keyframes orbIn{from{opacity:0;transform:translate(-50%,-50%) scale(.72)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  .ring{
    position:absolute;left:50%;top:50%;width:var(--orb);height:var(--orb);
    margin:calc(var(--orb) / -2) 0 0 calc(var(--orb) / -2);
    border-radius:50%;border:2px solid var(--navy);pointer-events:none;z-index:5;
    animation:ripple 2.8s ease-out infinite;
  }
  @keyframes ripple{0%{transform:scale(1);opacity:.35}100%{transform:scale(1.11);opacity:0}}
  .dashring{
    position:absolute;left:50%;top:50%;
    width:calc(var(--orb) * 1.13);height:calc(var(--orb) * 1.13);
    margin:calc(var(--orb) * -.565) 0 0 calc(var(--orb) * -.565);
    pointer-events:none;z-index:4;animation:sweep 22s linear infinite;
  }
  .dashring circle{fill:none;stroke:#9BB8CE;stroke-width:2.5;stroke-dasharray:9 11;stroke-linecap:round}
  @keyframes sweep{to{transform:rotate(360deg)}}
  .heart{color:#fff;display:flex;animation:beat 1.7s ease-in-out infinite}
  .heart svg{width:clamp(33px, calc(var(--W) * .10233), 44px);height:auto}
  @keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.2)}24%{transform:scale(1)}36%{transform:scale(1.12)}48%{transform:scale(1)}}
  .orb-cap{font-size:clamp(10px, calc(var(--W) * .02791), 12px);font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.9);margin-top:5px}
  .orb-val{font-size:clamp(13px, calc(var(--W) * .03721), 16px);font-weight:700;letter-spacing:-.01em;color:#fff;text-align:center;padding:0 10px;line-height:1.2}
  .orb-trend{font-size:clamp(9.5px, calc(var(--W) * .02558), 11px);font-weight:600;color:var(--gold);display:flex;align-items:center;gap:3px;margin-top:2px}
  .orb-trend svg{width:1em;height:1em}

  /* ---------------- velocity pill ---------------- */
  .velocity{
    margin-top:10px;background:var(--card);border:1px solid var(--border);border-radius:13px;
    padding:12px 14px;text-align:center;font-size:11.5px;font-weight:400;color:var(--muted);
  }

  /* ---------------- photo drawer trigger ---------------- */
  .fold-head{
    width:100%;appearance:none;border:none;cursor:pointer;font:inherit;margin-top:10px;
    display:flex;align-items:center;gap:11px;
    background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;
    box-shadow:0 3px 12px rgba(2,59,100,.24);
  }
  .fold-head:active{transform:scale(.99)}
  .nav-btn{justify-content:center;gap:8px}
  .nav-btn .fold-title{flex:0 0 auto;text-align:center;font-size:15px;font-weight:700}
  body.epc .nav-btn{display:none}          /* on EPC the header back arrow takes over */
  .fold-head .ic{display:flex;color:var(--gold)}
  .fold-head .ic svg{width:20px;height:20px}
  .fold-title{flex:1;text-align:left;font-size:14px;font-weight:600;letter-spacing:-.01em}
  .fold-chev{display:flex;color:var(--gold)}
  .fold-chev svg{width:19px;height:19px}

  /* ---------------- bottom curtain ---------------- */
  .backdrop{
    position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.5);
    opacity:0;pointer-events:none;transition:opacity .32s ease;
  }
  .backdrop.open{opacity:1;pointer-events:auto}
  .backdrop{touch-action:none}
  .curtain{
    position:fixed;left:0;right:0;bottom:0;margin-inline:auto;max-width:430px;
    z-index:60;background:var(--card);
    border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(15,23,42,.20);
    transform:translateY(100%);transition:transform .4s cubic-bezier(.25,.8,.3,1);
    max-height:min(86dvh,720px);display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
    will-change:transform;touch-action:none;
  }
  .curtain.open{transform:translateY(0)}
  .curtain.dragging{transition:none}
  /* whole head is the drag handle */
  .curtain-grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
  .grabber{width:44px;height:5px;border-radius:99px;background:#d5dce6;margin:11px auto 4px}
  .curtain-head{
    display:flex;align-items:center;gap:10px;padding:6px 16px 12px;border-bottom:1px solid var(--border);
  }
  .curtain-title{flex:1;font-size:15px;font-weight:700;letter-spacing:-.015em;color:var(--navy-deep)}
  .curtain-close{
    appearance:none;border:none;background:var(--grey-soft);color:var(--muted);cursor:pointer;
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;touch-action:manipulation;
  }
  .curtain-close:active{background:#e2e8f0}
  .curtain-close svg{width:17px;height:17px}
  .curtain-body{
    overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    padding:13px 16px calc(20px + env(safe-area-inset-bottom));touch-action:pan-y;
  }
  .photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .photo{display:flex;flex-direction:column;gap:5px}
  .photo img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:11px;border:1px solid var(--border);display:block}
  .photo .pc{font-size:11px;font-weight:600;color:var(--ink);line-height:1.25}
  .drawer-note{margin-top:12px;font-size:10px;color:var(--soft);text-align:center}

  /* ---------------- footer ---------------- */
  .cta-banner{
    margin-top:10px;text-decoration:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:#01243D;border-left:5px solid #0CA65D;border-radius:14px;padding:14px 16px;
  }
  .cta-text{font-size:12.5px;font-weight:400;color:#fff;line-height:1.35}
  .cta-text u{font-weight:600;color:#5fd39a;text-decoration-color:#5fd39a}
  .cta-banner img{height:19px;width:auto;flex-shrink:0}

  /* ---------------- states ---------------- */
  .state{min-height:60dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;color:var(--muted);padding-top:40px}
  .spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--track);border-top-color:var(--navy);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn{appearance:none;border:1px solid var(--border);background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:14px;padding:10px 26px;border-radius:12px;cursor:pointer}

  /* extra-tall screens (9:21 and taller): let the cards breathe */
  @media (min-height:820px){
    :root{ --cardh: clamp(158px, calc(var(--W) * .42), 180px); }
  }
  @media (prefers-reduced-motion:reduce){
    .heart,.ring,.dashring,.fresh-chip .dot{animation:none}
    .qcard,.orb{animation-duration:.01ms;opacity:1;transform:none}
    .orb{transform:translate(-50%,-50%)}
    .curtain,.backdrop{transition:none}
  }
</style>
</head>

    <button class="btn" onclick="loadData()">Retry</button>
  </div>

/* Tech's authoritative alias table - first normalisation layer, verbatim. */
const STATUS_ALIASES = {
  completed:'complete', complete:'complete',
  not_started:'not_yet_started', not_yet_started:'not_yet_started',
  on_track:'on_track', in_progress:'in_progress',
  delayed:'delayed', delayed_completion:'delayed',
  at_risk:'at_risk',
  high_risk:'at_high_risk', at_high_risk:'at_high_risk',
  medium_risk:'at_medium_risk', at_medium_risk:'at_medium_risk',
  low_risk:'at_low_risk', at_low_risk:'at_low_risk',
};
const STATUS = {
  delayed:        {label:"Delayed",     color:"var(--red)",    soft:"var(--red-soft)"},
  at_high_risk:   {label:"High Risk",   color:"var(--orange)", soft:"var(--orange-soft)"},
  at_medium_risk: {label:"Medium Risk", color:"var(--amber)",  soft:"var(--amber-soft)"},
  at_risk:        {label:"At Risk",     color:"var(--amber)",  soft:"var(--amber-soft)"},
  at_low_risk:    {label:"Low Risk",    color:"var(--yellow)", soft:"var(--yellow-soft)"},
  on_track:       {label:"On Track",    color:"var(--blue)",   soft:"var(--blue-soft)"},
  in_progress:    {label:"In Progress", color:"var(--blue)",   soft:"var(--blue-soft)"},
  not_yet_started:{label:"Not Started", color:"var(--grey)",   soft:"var(--grey-soft)"},
  complete:       {label:"Completed",   color:"var(--green)",  soft:"var(--green-soft)"}
};
function canonStatus(s){ s=String(s||"").toLowerCase().trim(); s=STATUS_ALIASES[s]||s; return STATUS[s]?s:"not_yet_started"; }
function sMeta(s){ return STATUS[canonStatus(s)]; }

const n0 = v => (v==null||isNaN(v)) ? 0 : Number(v);
function pct1(v){ if(v==null||isNaN(v)) return "\u2014"; const r=Math.round(v*10)/10; return (r%1===0?r.toFixed(0):r.toFixed(1))+"%"; }
function fmtDateShortYr(d){ if(!d) return "\u2014"; const dt=new Date(d); if(isNaN(dt)) return "\u2014";
  const p=dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"2-digit"}).replace(/,/g,"").split(" ");
  return p[0]+" "+p[1].slice(0,3)+" '"+p[2]; }

function trendMeta(ai){
  const t=String(ai||"").toLowerCase();
  if(/improv|acceler|recover|speed/.test(t)) return {dir:"up"};
  if(/slow|stall|declin|worsen|drop/.test(t)) return {dir:"down"};
  return {dir:"flat"};
}
function issueIsOpen(iss){ return !/resolv|clos|complete|done/.test(String((iss&&iss.status)||"open").toLowerCase()); }
function countOpenIssues(project){
  let n=0;
  for(const po of (project.pos||[])){
    n += (po.issues||[]).filter(issueIsOpen).length;
    for(const it of (po.items||[])){
      n += (it.issues||[]).filter(issueIsOpen).length;
      for(const m of (it.milestones||[])) n += (m.issues||[]).filter(issueIsOpen).length;
    }
  }
  return n;
}
function computeModel(payload){
  const project=(((payload||{}).data||{}).projects||[])[0];
  if(!project) return null;
  /* the "-DOC" PO is a master-document-list artefact; take the trend from a real PO */
  const pos=project.pos||[];
  const primaryPO = pos.find(po=>!/-DOC$/i.test(String(po.poNumber||""))) || pos[0] || {};
  const done = !!project.actualEndDate || canonStatus(project.status)==="complete";
  return {
    name: project.name || "Project",
    status: sMeta(project.status),
    ai: primaryPO.aiStatus || null,
    act: project.actualCompletionPercentage,
    exp: project.expectedCompletionPercentage,
    done,
    endDate: done ? (project.actualEndDate||project.estimatedEndDate) : (project.estimatedEndDate||project.plannedEndDate),
    planned: project.plannedEndDate,
    delayDays: n0(project.estimatedDelayDays),
    openIssues: countOpenIssues(project)
  };
}

function renderView(key, push){
  const v = VIEWS[key] || VIEWS.overall;
  currentView = key;

  document.documentElement.style.setProperty("--cardline", v.accent);
  document.body.classList.toggle("epc", key === "epc");

  const pill = document.getElementById("viewPill");
  pill.textContent = v.pill;
  pill.classList.toggle("epc", key === "epc");

  document.getElementById("projName").textContent = PROJECT_NAME;
  document.getElementById("todayDate").textContent =
    "Today, " + new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});

  const nIss = v.issues;
  const issVal = nIss===0 ? "No issues" : nIss+(nIss===1?" issue":" issues");

  const gapPill = '<span class="pill '+(v.physical.ahead?'ahead':'behind')+'">'+esc(v.physical.delta)+'</span>';
  /* estimated == planned on both views, so the schedule pill reads clean */
  const late = Math.round((new Date(v.completion.est) - new Date(v.completion.plan)) / 86400000);
  const dw = n => n+(n===1?" day":" days");
  const datePill = late > 0 ? '<span class="pill behind">'+dw(late)+' behind</span>'
                 : (late < 0 ? '<span class="pill ahead">'+dw(Math.abs(late))+' ahead</span>'
                             : '<span class="pill ahead">On schedule</span>');

  document.getElementById("stage").innerHTML =
    '<div class="qcard q1">'
      +chipEl(ICONS.scurve)
      +'<div class="txt">'
        +'<div class="cap">Physical Progress</div>'
        +'<div class="val">'+esc(v.physical.value)+'</div>'
        +'<div class="sub">'+esc(v.physical.plan)+'</div>'
        +gapPill
      +'</div>'
    +'</div>'
    +'<div class="qcard q2">'
      +chipEl(ICONS.calclock)
      +'<div class="txt">'
        +'<div class="cap">Estd. Completion</div>'
        +'<div class="val">'+fmtDateShortYr(v.completion.est)+'</div>'
        +'<div class="sub">'+v.dateLabel+' '+fmtDateShortYr(v.completion.plan)+'</div>'
        +datePill
      +'</div>'
    +'</div>'
    +'<div class="qcard q3">'
      +chipEl(ICONS.rupee,'gold')
      +'<div class="txt">'
        +'<div class="cap">Financial Progress</div>'
        +'<div class="val">'+esc(v.financial.value)+'</div>'
        +'<div class="sub">'+esc(v.financial.sub)+'</div>'
      +'</div>'
    +'</div>'
    +'<div class="qcard q4">'
      +chipEl(nIss===0?ICONS.allclear:ICONS.alert, nIss===0?'ok':'bad')
      +'<div class="txt">'
        +'<div class="cap">Open Issues</div>'
        +'<div class="val '+(nIss===0?'ok':'bad')+'">'+issVal+'</div>'
        +'<div class="sub">Login to SitePulse for details</div>'
      +'</div>'
    +'</div>'
    +'<svg class="dashring" viewBox="0 0 186 186"><circle cx="93" cy="93" r="91"/></svg>'
    +'<div class="ring"></div>'
    +'<div class="orb">'
      +'<div class="heart">'+ICONS.heart+'</div>'
      +'<div class="orb-cap">Health</div>'
      +'<div class="orb-val">'+esc(st.label)+'</div>'
      +'<div class="orb-trend">'+ICONS.up+esc(v.trend)+'</div>'
    +'</div>';

  /* photographs: render this view's set, hide the whole section when empty */
  const pics = v.photos || [];
  const trigger = document.getElementById("photoBtn");
  if(pics.length === 0){
    trigger.style.display = "none";
    closeCurtain();
  } else {
    trigger.style.display = "flex";
    document.getElementById("photoCount").textContent = "Site Photographs ("+pics.length+")";
    document.getElementById("curtainCount").textContent = "Site Photographs ("+pics.length+")";
    document.getElementById("photoGrid").innerHTML = pics.map(p =>
      '<div class="photo"><img loading="lazy" decoding="async" src="'+p.s+'" alt="'+esc(p.c)+'">'
      +'<div class="pc">'+esc(p.c)+'</div></div>').join("");
  }

  document.getElementById("loading").style.display="none";
  document.getElementById("errorState").style.display="none";
  document.getElementById("dash").style.display="block";
  toTop();

  /* phone/browser back returns to the overall view instead of leaving the page */
  if(push){
    if(key==="epc") history.pushState({view:"epc"}, "", "#epc");
    else if(history.state && history.state.view==="epc") history.back();
  }
}

function goEPC(){ if(currentView!=="epc") renderView("epc", true); }
function goOverall(){ if(currentView!=="overall") renderView("overall", true); }
window.addEventListener("popstate", ()=>{ renderView((location.hash==="#epc")?"epc":"overall", false); });

/* ---------- bottom curtain (mobile sheet) ---------- */
const sheet   = () => document.getElementById("curtain");
const backdrop= () => document.getElementById("backdrop");
let lockedY = 0;

/* iOS Safari ignores overflow:hidden on body, so pin it instead and restore after */
function lockScroll(){
  lockedY = window.scrollY || 0;
  const b=document.body;
  b.style.position="fixed"; b.style.top=(-lockedY)+"px"; b.style.left="0"; b.style.right="0"; b.style.width="100%";
}
function unlockScroll(){
  const b=document.body;
  b.style.position=""; b.style.top=""; b.style.left=""; b.style.right=""; b.style.width="";
  window.scrollTo(0,lockedY);
}

function openCurtain(){
  const c=sheet();
  c.style.transform=""; backdrop().style.opacity="";
  c.classList.add("open"); backdrop().classList.add("open");
  lockScroll();
  setTimeout(()=>{ const b=c.querySelector(".curtain-close"); if(b) b.focus({preventScroll:true}); },260);
}
function closeCurtain(){
  const c=sheet();
  if(!c.classList.contains("open")) return;
  c.classList.remove("dragging");
  c.style.transform=""; backdrop().style.opacity="";
  c.classList.remove("open"); backdrop().classList.remove("open");
  unlockScroll();
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeCurtain(); });

/* swipe the sheet down to dismiss - drag from the header/grabber area */
(function enableSwipe(){
  const grip=document.getElementById("curtainGrip");
  if(!grip) return;
  let startY=null, dy=0, t0=0;

  const point = e => (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;

  function begin(e){
    if(e.target.closest(".curtain-close")) return;   /* let the button do its job */
    startY=point(e); dy=0; t0=Date.now();
    sheet().classList.add("dragging");
  }
  function move(e){
    if(startY===null) return;
    dy=Math.max(0, point(e)-startY);                 /* downward only */
    sheet().style.transform="translateY("+dy+"px)";
    backdrop().style.opacity=String(Math.max(0,1-dy/340));
    if(e.cancelable) e.preventDefault();
  }
  function end(){
    if(startY===null) return;
    const flick = dy>28 && (Date.now()-t0)<260;      /* quick downward flick */
    const c=sheet();
    c.classList.remove("dragging");
    startY=null;
    if(dy>110 || flick){ closeCurtain(); }
    else { c.style.transform=""; backdrop().style.opacity=""; }
  }

  grip.addEventListener("touchstart", begin, {passive:true});
  grip.addEventListener("touchmove",  move,  {passive:false});
  grip.addEventListener("touchend",   end);
  grip.addEventListener("touchcancel",end);
  grip.addEventListener("mousedown", e=>{ begin(e);
    const mm=ev=>move(ev), mu=()=>{ end(); window.removeEventListener("mousemove",mm); window.removeEventListener("mouseup",mu); };
    window.addEventListener("mousemove",mm); window.addEventListener("mouseup",mu);
  });
})();

/* ---------- always open at the top ---------- */
if("scrollRestoration" in history) history.scrollRestoration="manual";
function toTop(){ window.scrollTo(0,0); document.documentElement.scrollTop=0; document.body.scrollTop=0; }
toTop(); window.addEventListener("load",toTop); window.addEventListener("pageshow",toTop);

/* ---------- fetch ---------- */
function showError(msg){
  document.getElementById("loading").style.display="none";
  document.getElementById("dash").style.display="none";
  document.getElementById("errorMsg").textContent=msg||"";
  document.getElementById("errorState").style.display="flex";
}

async function loadData(){
  document.getElementById("errorState").style.display="none";
  document.getElementById("dash").style.display="none";
  document.getElementById("loading").style.display="flex";

  if(STATIC_MODE){
    /* the endpoint is still called so the wiring stays live, but the figures
       shown come from VIEWS above - the response is intentionally not used. */
    try{
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(),FETCH_TIMEOUT_MS);
      fetch(ENDPOINT_URL,{signal:ctrl.signal,cache:"no-store"}).finally(()=>clearTimeout(timer)).catch(()=>{});
    }catch(e){ /* ignore - static render does not depend on it */ }
    renderView((location.hash==="#epc")?"epc":"overall", false);
    return;
  }

  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),FETCH_TIMEOUT_MS);
  try{
    const res=await fetch(ENDPOINT_URL,{signal:ctrl.signal,cache:"no-store"});
    clearTimeout(timer);
    if(!res.ok) return showError("The data service responded with an error ("+res.status+").");
    const payload=await res.json();
    if(payload.error) return showError(String(payload.error));
    if(!computeModel(payload)) return showError("No project found in the data.");
    renderView("overall", false);
  }catch(e){
    clearTimeout(timer);
    showError("Check your connection and try again.");
  }
}
loadData();
</script>
